<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternSync</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--Bookstrap Icon-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!--Google Font API-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira+Stencil:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!--Custom css-->
    <link rel="stylesheet" href="css/style.css">
  </head>
<body>

    <div id="bg-particles"></div>

    <!--Login Form-->
    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="card login-card">
            <div class="card-body">
                <h3 class="text-center">LOGIN</h3>
                <div class="row">
                    <div class="col-md-6 d-flex justify-content-center align-items-center">
                    <img src="img/logo.png" alt="InternSync Logo" class="img-fluid" style="max-width: 150px;">
                    </div>
                    <div class="col-md-6">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="form-control mb-2">

                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control mb-2">

                        <small id="errorMsg" style="color:red; display:none;">Invalid email or password</small>

                        <button onclick="login()" class="btn btn-primary login-btn">Login</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
    <script>
        tsParticles.load("bg-particles", {
            background: { color: "#0a0a1a" },
            particles: {
                number: { value: 100 },
                color: { value: "#ffffff" },
                links: {
                    enable: true,
                    color: "#ffffff",
                    opacity: 0.2
                },
                move: { enable: true, speed: 1 },
                opacity: { value: 0.5 },
                size: { value: 2 }
            },
            interactivity: {
                events: {
                    onHover: { enable: true, mode: "repulse" }
                }
            }
        });
    </script>
    <script>
        function login() {
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let errorMsg = document.getElementById("errorMsg");
            let correctEmail = "aliyah@gmail.com";
            let correctPassword = "12345";
            if (email === correctEmail && password === correctPassword) {
                window.location.href = "dashboard.html"; 
            } else {
                errorMsg.style.display = "block"; 
            }
        }
    </script>

</body>
</html>
