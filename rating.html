<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Rating</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
     <!--Bookstrap Icon-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!--Google Font API-->
    <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
     <!--Custom css-->
    <link rel="stylesheet" href="css/style2.css">

</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">Home</a>
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="total.html"> List of Internship Place</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle"
                       href="#"
                       data-bs-toggle="dropdown">See More</a>
                    <ul class="dropdown-menu">
                        <li>
                            <a class="dropdown-item" href="rating.html">Internship Rating</a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="top.html">Top Internship Place</a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <a class="dropdown-item style=background-color:red;" href="index.html" style=color:red;> Log Out </a>
                        </li>
                    </ul>
                </li>
            </ul>
            <button class="dark-mode-toggle" id="darkModeToggle">
                <i class="bi bi-moon-stars-fill"
                   id="darkModeIcon"></i>
            </button>
        </div>
    </div>
</nav>

<!-- Content -->
<div class="container py-4">

    <h3 class="page-title mb-1">
        <i class="bi bi-star-fill me-2"
           style="color:hotpink"></i> Internship Place Rating </h3>

    <p class="text-muted mb-4"> Rate every Internship Place You've Been Accepted! </p>

     <!-- Cards -->
    <div class="row g-4"
         id="ratingGrid">
    </div>

     <!-- Empty -->
    <div id="emptyState"
         class="text-center empty-state d-none">
        <i class="bi bi-stars"
           style="font-size:2.5rem;
                  color:var(--pink);
                  display:block;
                  margin-bottom:10px;"></i>
            <br>
            <a href="dashboard.html"
               style="color:var(--pink)"></a>
    </div>
</div>

<footer class="text-center p-3 mt-5 bg-secondary text-white"><i class="bi bi-c-circle"></i> 2026 Internship Tracker | Aliyah</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
function getInternList(){
    return JSON.parse(
        localStorage.getItem('internList') || '[]'
    );
}
function getRatings(){
    return JSON.parse(
        localStorage.getItem('internRatings') || '{}'
    );
}
function saveRatings(ratings){
    localStorage.setItem(
        'internRatings',
        JSON.stringify(ratings)
    );
}
function saveRating(id,value){
    const ratings = getRatings();
    ratings[id] = parseInt(value);
    saveRatings(ratings);
    renderCards();
}
function starsInput(id,current){
    let html = `
        <div class="star-group">
    `;
    for(let i=5; i>=1; i--){
        const checked =
            current === i ? 'checked' : '';
        html += `
            <input
                type="radio"
                id="s${id}-${i}"
                name="rating-${id}"
                value="${i}"
                ${checked}
                onchange="saveRating(${id},${i})"
            >
            <label
                for="s${id}-${i}">
                ★
            </label>
        `;
    }
    html += `</div>`;
    return html;
}

function starsText(rating){
    if(!rating){
        return `
            <span class="text-muted small">
                Not rate yet
            </span>
        `;
    }
    const filled = '★'.repeat(rating);
    const empty  = '☆'.repeat(5-rating);
    return `
        <span class="stars-display">
            ${filled}
        </span>
        <span class="stars-empty">
            ${empty}
        </span>
        <span class="text-muted small">
            (${rating}/5)
        </span>
    `;
}

function renderCards(){
    const list = getInternList()
        .filter(d => d.status === 'Accepted');
    const ratings = getRatings();
    const grid  = document.getElementById('ratingGrid');
    const empty = document.getElementById('emptyState');
    if(list.length === 0){
        grid.innerHTML = '';
        empty.classList.remove('d-none');
        return;
    }
    empty.classList.add('d-none');
    grid.innerHTML = list.map(d => {
        const rating = ratings[d.id] || 0;
        return `
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="card rating-card h-100">
                    <div class="card-header">
                        <i class="bi bi-building me-1"></i>
                        ${escHtml(d.title)}
                    </div>
                    <div class="card-body text-center py-4">
                        ${starsInput(d.id,rating)}
                        <div class="mt-3">
                            ${starsText(rating)}
                        </div>
                    </div>
                </div>
            </div>
        `;

    }).join('');
}

function escHtml(str){
    return str
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;');
}
renderCards();
</script>

<!-- Dark Mode Toggle -->
<script>
    const darkModeToggle =
        document.getElementById('darkModeToggle');
    const darkModeIcon =
        document.getElementById('darkModeIcon');
    const htmlEl =
        document.documentElement;
    const savedTheme =
        localStorage.getItem('theme') || 'light';
    htmlEl.setAttribute(
        'data-bs-theme',
        savedTheme
);
    updateIcon(savedTheme);
    darkModeToggle.addEventListener('click',() => {
        const current =
            htmlEl.getAttribute('data-bs-theme');
        const newTheme =
            current === 'light'
            ? 'dark'
            : 'light';
        htmlEl.setAttribute(
            'data-bs-theme',
            newTheme
        );
        localStorage.setItem(
            'theme',
            newTheme
        );
        updateIcon(newTheme);
});
    function updateIcon(theme){
        darkModeIcon.className =
            theme === 'dark'
            ? 'bi bi-sun-fill'
            : 'bi bi-moon-stars-fill';
}

</script>

</body>
</html>
