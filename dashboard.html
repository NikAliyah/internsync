<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
     <!--Custom css-->
    <link rel="stylesheet" href="css/style1.css">

</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">Home</a>
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="total.html"> List of Internship Place</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle"
                       href="#"
                       data-bs-toggle="dropdown">See More</a>
                    <ul class="dropdown-menu">
                        <li>
                            <a class="dropdown-item" href="rating.html">Internship Rating</a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="top.html">Top Internship Place</a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <a class="dropdown-item style=background-color:red;" href="index.html" style=color:red;> Log Out </a>
                        </li>
                    </ul>
                </li>
            </ul>
            <button class="dark-mode-toggle" id="darkModeToggle">
                <i class="bi bi-moon-stars-fill"
                   id="darkModeIcon"></i>
            </button>
        </div>
    </div>
</nav>

<div class="container py-4">

    <!-- Title -->
    <h3 class="page-title mb-1">
        <i class="bi bi-speedometer2 me-2" style="color:hotpink"></i>
        Dashboard
    </h3>
    <p class="text-muted mb-4">
        Welcome Back To InternSync!
    </p>
    <!-- Add Form -->
    <div class="card p-3 mb-4"
         style="border:2px solid var(--pink); border-radius:12px;">
        <div class="row g-2 align-items-end">
            <div class="col-md-6">
                <label class="form-label fw-semibold">
                    Internship Place
                </label>
                <input type="text"
                       class="form-control"
                       id="internInput"
                       placeholder="e.g. Deloitte">
            </div>
            <div class="col-md-3">
                <label class="form-label fw-semibold">
                    Status
                </label>
                <select class="form-select"
                        id="statusSelect">
                    <option value="Accepted">
                        Accepted
                    </option>
                    <option value="Pending">
                        Pending
                    </option>
                    <option value="Rejected">
                        Rejected
                    </option>
                </select>
            </div>
            <div class="col-md-3">
                <button class="btn w-100 text-white"
                        style="background:#CC3586;"
                        onclick="handleAdd()">
                    <i class="bi bi-plus-circle me-1"></i>
                    Add Internship Place
                </button>
            </div>
        </div>
    </div>

    <!-- Status Cards -->
    <div class="row g-3 mb-4">

        <div class="col-6 col-md-3">
            <div class="card dashboard-card text-center p-3">
                <i class="bi bi-card-checklist mb-2"
                   style="font-size:2rem;color:yellow">
                </i>
                <div class="stat-number"
                     id="statTotal">
                    0
                </div>
                <div>Total Apply</div>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="card dashboard-card text-center p-3">
                <i class="bi bi-check-circle-fill mb-2"
                   style="font-size:2rem;color:green">
                </i>
                <div class="stat-number"
                     id="statAccepted">
                    0
                </div>
                <div>Accepted</div>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="card dashboard-card text-center p-3">
                <i class="bi bi-clock-fill mb-2"
                   style="font-size:2rem;color:orange">
                </i>
                <div class="stat-number"
                     id="statPending">
                    0
                </div>
                <div>Pending</div>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="card dashboard-card text-center p-3">
                <i class="bi bi-x-circle-fill mb-2"
                   style="font-size:2rem;color:red">
                </i>
                <div class="stat-number"
                     id="statRejected">
                    0
                </div>
                <div>Rejected</div>
            </div>
        </div>
    </div>

    <!-- Charts -->
    <div class="row justify-content-center g-4">

        <!-- Doughnut Charts -->
        <div class="col-12 col-lg-4">
            <div class="chart-card p-3 h-100">
                <h5 class="fw-bold mb-4 text-center">
                    <i class="bi bi-pie-chart-fill me-2"></i>
                    Rating Distribution
                </h5>
                <div class="d-flex justify-content-center align-items-center">
                    <div style="max-width:320px;width:100%;">
                        <canvas id="doughnutChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bar Charts -->
        <div class="col-12 col-lg-8">
            <div class="chart-card p-3 h-100">
                <h5 class="fw-bold mb-4 text-center">
                    <i class="bi bi-bar-chart-fill me-2"></i>
                    Rating Every Internship Place
                </h5>
                <canvas id="barChart"></canvas>
            </div>
        </div>
    </div>

</div>

<footer class="text-center p-3 mt-5 bg-secondary text-white"><i class="bi bi-c-circle"></i> 2026 Internship Tracker | Aliyah</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
function getInternList(){
    return JSON.parse(
        localStorage.getItem('internList') || '[]'
    );
} function saveInternList(list) {
    localStorage.setItem(
        'internList',
        JSON.stringify(list)
    );
}
function getRatings(){
    return JSON.parse(
        localStorage.getItem('internRatings') || '{}'
    );
}
function handleAdd(){
    const title =
        document.getElementById('internInput')
        .value
        .trim();
    const status =
        document.getElementById('statusSelect')
        .value;
    if(!title){
        alert('Please enter company name!');
        return;
    }
    const list = getInternList();
    list.push({
        id:Date.now(),
        title:title,
        status:status
    });
    saveInternList(list);
    document.getElementById('internInput').value = '';
    updateStats();
    location.reload();
}

function updateStats(){
    const list = getInternList();

    document.getElementById('statTotal').textContent =
        list.length;

    document.getElementById('statAccepted').textContent =
        list.filter(d => d.status === 'Accepted').length;

    document.getElementById('statPending').textContent =
        list.filter(d => d.status === 'Pending').length;

    document.getElementById('statRejected').textContent =
        list.filter(d => d.status === 'Rejected').length;
}

function buildCharts(){
    const list =
        getInternList()
        .filter(d => d.status === 'Accepted');
    const ratings = getRatings();
    const rated = list
        .filter(d => ratings[d.id] !== undefined)
        .map(d => ({
            title:d.title,
            rating:ratings[d.id]
        }));
    if(rated.length === 0) return;

    //Doughnut Chart
    const dist = [1,2,3,4,5].map(
        star =>
            rated.filter(d => d.rating === star).length
    );
    new Chart(
        document.getElementById('doughnutChart'),
        {
            type:'doughnut',
            data:{
                labels:[
                    '1★',
                    '2★',
                    '3★',
                    '4★',
                    '5★'
                ],
                datasets:[{
                    data:dist,
                    backgroundColor:[
                        '#dc3545',
                        '#fd7e14',
                        '#ffc107',
                        '#0dcaf0',
                        '#198754'
                    ]
                }]
            }
        }
    );

    // BAR CHART
    new Chart(
        document.getElementById('barChart'),
        {
            type:'bar',
            data:{
                labels:rated.map(d => d.title),
                datasets:[{
                    label:'Rating',
                    data:rated.map(d => d.rating),
                    backgroundColor:[
                        '#e91e8c',
                        '#ff6b6b',
                        '#ffc107',
                        '#0dcaf0',
                        '#198754',
                        '#6f42c1',
                        '#fd7e14'
                    ],
                    borderRadius:8
                }]
            },
            options:{
                responsive:true,
                scales:{
                    y:{
                        min:0,
                        max:5,
                        ticks:{
                        stepSize:1
                        }
                    }
                },
                plugins:{
                    legend:{
                        display:false
                    }
                }
            }
        }
    );
}

updateStats();
buildCharts();

</script>

 <!-- Dark Mode -->
<script>
    const darkModeToggle =
        document.getElementById('darkModeToggle');
    const darkModeIcon =
        document.getElementById('darkModeIcon');
    const htmlEl =
        document.documentElement;
    const savedTheme =
        localStorage.getItem('theme') || 'light';
    htmlEl.setAttribute(
        'data-bs-theme',
        savedTheme
);
    updateIcon(savedTheme);
    darkModeToggle.addEventListener('click', () => {
        const current =
            htmlEl.getAttribute('data-bs-theme');
        const newTheme =
            current === 'light'
            ? 'dark'
            : 'light';
        htmlEl.setAttribute(
            'data-bs-theme',
            newTheme
        );
        localStorage.setItem(
            'theme',
            newTheme
        );
        updateIcon(newTheme);
});
    function updateIcon(theme){
        darkModeIcon.className =
            theme === 'dark'
            ? 'bi bi-sun-fill'
            : 'bi bi-moon-stars-fill';
    }
</script>

</body>
</html>
